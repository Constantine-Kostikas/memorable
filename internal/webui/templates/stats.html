<h1 class="mb-4 text-page font-bold">Stats</h1>
<dl class="mb-6 grid grid-cols-3 gap-4">
  <div class="rounded-md border border-line bg-sheet p-3"><dt class="text-meta text-ink-muted">Total</dt><dd class="text-page font-bold">{{.Total}}</dd></div>
  <div class="rounded-md border border-line bg-sheet p-3"><dt class="text-meta text-ink-muted">Embedded</dt><dd class="text-page font-bold">{{.Embedded}}</dd></div>
  <div class="rounded-md border border-line bg-sheet p-3"><dt class="text-meta text-ink-muted">Pending jobs</dt><dd class="text-page font-bold">{{.PendingJobs}}</dd></div>
</dl>
<div class="grid gap-6 sm:grid-cols-3">
  {{range .Groups}}
  <section>
    <h2 class="mb-2 text-title font-bold">{{.Heading}}</h2>
    {{if .Rows}}
    <table class="w-full text-left text-body">
      <tbody class="divide-y divide-line">
        {{range .Rows}}<tr><th scope="row" class="py-1 font-normal">{{.Name}}</th><td class="py-1 text-right">{{.Count}}</td></tr>{{end}}
      </tbody>
    </table>
    {{else}}<p class="text-ink-muted">None.</p>{{end}}
  </section>
  {{end}}
</div>
