<section id="prune">
  <h1 class="mb-4 text-page font-bold">Prune access events</h1>
  {{if .Notice}}<p role="status" class="mb-4 notice-ok p-3">{{.Notice}}</p>{{end}}
  {{if .Error}}<p role="alert" class="mb-4 notice-danger p-3">{{.Error}}</p>{{end}}
  <p class="mb-4">Dry run: pruning now would delete {{.Count}} access events older than the retention period.</p>
  <form method="post" action="{{.Action}}" hx-post="{{.Action}}" hx-target="#prune" hx-swap="outerHTML" hx-confirm="Delete old access events?">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <button type="submit" class="btn btn-danger">Prune</button>
  </form>
</section>
