<div class="workspace grid min-[900px]:h-full min-[900px]:grid-cols-[340px_minmax(0,1fr)] min-[900px]:grid-rows-[minmax(0,1fr)]">
  {{template "memories.html" .}}
  {{if .Selected}}{{template "detail.html" .Selected}}{{else}}<section id="detail-pane" aria-label="Memory" class="detail-pane flex items-center justify-center p-6 min-[900px]:min-h-0">
    <p class="text-ink-muted">Select a memory, or press Ctrl K to jump to one.</p>
  </section>{{end}}
</div>
{{define "pane_error.html"}}<section id="detail-pane" aria-label="Memory" class="detail-pane pane-selected min-w-0 p-4 min-[900px]:min-h-0 min-[900px]:overflow-y-auto">
  <p class="mb-3 text-body min-[900px]:hidden"><a href="{{.ListURL}}" class="underline">Back to memories</a></p>
{{template "error.html" .}}
</section>{{end}}
