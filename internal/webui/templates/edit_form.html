<div id="memory-detail">
  {{if .Error}}<p role="alert" class="mb-4 notice-danger p-3">{{.Error}}{{if .Conflict}} <a href="{{.Base}}/edit" hx-get="{{.Base}}/edit" hx-target="#memory-detail" hx-swap="outerHTML" class="underline">Reload the latest version</a>{{end}}</p>{{end}}
  <h1 class="mb-4 text-page font-bold">Edit memory</h1>
  <form method="post" action="{{.Base}}/update" hx-post="{{.Base}}/update" hx-target="#memory-detail" hx-swap="outerHTML" class="flex flex-col gap-3">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <input type="hidden" name="version" value="{{.Version}}">
    <label class="flex flex-col text-body">Title
      <input type="text" name="title" value="{{.Title}}" required class="field">
    </label>
    <label class="flex flex-col text-body">Content
      <textarea name="content" rows="12" required class="field">{{.Content}}</textarea>
    </label>
    <label class="flex flex-col text-body">Tags (comma-separated)
      <input type="text" name="tags" value="{{.Tags}}" class="field">
    </label>
    <label class="flex flex-col text-body">Type
      <select name="type" class="field">
        {{range .Types}}<option value="{{.}}"{{if eq . $.Type}} selected{{end}}>{{.}}</option>{{end}}
      </select>
    </label>
    <label class="flex items-center gap-2 text-body">
      <input type="checkbox" name="pinned" value="on"{{if .Pinned}} checked{{end}}> Pinned
    </label>
    <label class="flex flex-col text-body">Expires at (RFC 3339 or date; empty clears)
      <input type="text" name="expires_at" value="{{.ExpiresAt}}" class="field">
    </label>
    <div class="flex gap-3">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{{.DetailURL}}" hx-get="{{.DetailURL}}" hx-target="#memory-detail" hx-swap="outerHTML" hx-push-url="true" class="btn">Cancel</a>
    </div>
  </form>
</div>
