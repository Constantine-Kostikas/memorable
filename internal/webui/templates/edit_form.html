<div id="memory-detail">
  {{if .Error}}<p role="alert" class="mb-4 rounded border border-red-200 bg-red-50 p-3 text-red-900">{{.Error}}{{if .Conflict}} <a href="{{.Base}}/edit" hx-get="{{.Base}}/edit" hx-target="#memory-detail" hx-swap="outerHTML" class="underline">Reload the latest version</a>{{end}}</p>{{end}}
  <h1 class="mb-4 text-xl font-semibold">Edit memory</h1>
  <form method="post" action="{{.Base}}/update" hx-post="{{.Base}}/update" hx-target="#memory-detail" hx-swap="outerHTML" class="flex flex-col gap-3">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <input type="hidden" name="version" value="{{.Version}}">
    <label class="flex flex-col text-sm">Title
      <input type="text" name="title" value="{{.Title}}" required class="rounded border border-gray-300 px-2 py-1">
    </label>
    <label class="flex flex-col text-sm">Content
      <textarea name="content" rows="12" required class="rounded border border-gray-300 px-2 py-1 font-mono">{{.Content}}</textarea>
    </label>
    <label class="flex flex-col text-sm">Tags (comma-separated)
      <input type="text" name="tags" value="{{.Tags}}" class="rounded border border-gray-300 px-2 py-1">
    </label>
    <label class="flex flex-col text-sm">Type
      <select name="type" class="rounded border border-gray-300 px-2 py-1">
        {{range .Types}}<option value="{{.}}"{{if eq . $.Type}} selected{{end}}>{{.}}</option>{{end}}
      </select>
    </label>
    <label class="flex items-center gap-2 text-sm">
      <input type="checkbox" name="pinned" value="on"{{if .Pinned}} checked{{end}}> Pinned
    </label>
    <label class="flex flex-col text-sm">Expires at (RFC 3339 or date; empty clears)
      <input type="text" name="expires_at" value="{{.ExpiresAt}}" class="rounded border border-gray-300 px-2 py-1">
    </label>
    <div class="flex gap-3">
      <button type="submit" class="rounded bg-gray-900 px-3 py-1 text-white">Save</button>
      <a href="{{.DetailURL}}" hx-get="{{.DetailURL}}" hx-target="#memory-detail" hx-swap="outerHTML" hx-push-url="true" class="rounded border border-gray-300 px-3 py-1 hover:bg-gray-100">Cancel</a>
    </div>
  </form>
</div>
