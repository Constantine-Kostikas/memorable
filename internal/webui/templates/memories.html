<h1 class="mb-4 text-page font-bold">Memories</h1>
<form method="get" action="/c/{{.Context}}/memories" class="mb-4 flex flex-wrap items-end gap-3">
  <label class="flex flex-col text-body">Search
    <input type="search" name="q" value="{{.Filter.Query}}" autocomplete="off" placeholder="Search memories"
      class="field"
      hx-get="/c/{{.Context}}/memories" hx-trigger="input changed delay:300ms, search"
      hx-target="#memory-rows" hx-include="closest form" hx-push-url="true">
  </label>
  <label class="flex flex-col text-body">Project
    <select name="project" class="field"
      hx-get="/c/{{.Context}}/memories" hx-trigger="change" hx-target="#memory-rows" hx-include="closest form" hx-push-url="true">
      <option value="">All projects</option>
      {{range .Projects}}<option value="{{.}}"{{if eq . $.Filter.Project}} selected{{end}}>{{.}}</option>{{end}}
    </select>
  </label>
  <label class="flex flex-col text-body">Type
    <select name="type" class="field"
      hx-get="/c/{{.Context}}/memories" hx-trigger="change" hx-target="#memory-rows" hx-include="closest form" hx-push-url="true">
      <option value="">All types</option>
      {{range .Types}}<option value="{{.}}"{{if eq . $.Filter.Type}} selected{{end}}>{{.}}</option>{{end}}
    </select>
  </label>
  <label class="flex flex-col text-body">Status
    <select name="status" class="field"
      hx-get="/c/{{.Context}}/memories" hx-trigger="change" hx-target="#memory-rows" hx-include="closest form" hx-push-url="true">
      <option value="">Default</option>
      {{range .Statuses}}<option value="{{.}}"{{if eq . $.Filter.Status}} selected{{end}}>{{.}}</option>{{end}}
    </select>
  </label>
  <label class="flex flex-col text-body">Tag
    <input type="text" name="tag" value="{{with .Filter.Tags}}{{index . 0}}{{end}}" class="field"
      hx-get="/c/{{.Context}}/memories" hx-trigger="input changed delay:300ms" hx-target="#memory-rows" hx-include="closest form" hx-push-url="true">
  </label>
  <button type="submit" class="btn btn-primary">Apply</button>
</form>
<div id="memory-rows">
{{template "memory_rows.html" .}}
</div>
