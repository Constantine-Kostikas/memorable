name: Label PRs

# pull_request_target runs with the base branch's workflow and config and never checks out
# PR code, so it can label PRs from forks safely.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
