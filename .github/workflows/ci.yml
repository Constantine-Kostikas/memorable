name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Latest 1.26 patch directly, so the go.mod toolchain line never triggers a second download.
          go-version: "1.26.x"
          check-latest: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: make css-check htmx-check mdtoolbar-check fonts-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Latest 1.26 patch directly, so the go.mod toolchain line never triggers a second download.
          go-version: "1.26.x"
          check-latest: true
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Latest 1.26 patch directly, so the go.mod toolchain line never triggers a second download.
          go-version: "1.26.x"
          check-latest: true
      - run: go test -race -tags=integration ./...
        env:
          # The runner VM is discarded after the job, so the reaper is not needed; with it enabled,
          # containers were removed mid-run and store tests failed with "unexpected EOF".
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Dump test containers
        if: failure()
        run: |
          for c in $(docker ps -aq); do
            docker inspect "$c" --format '{{.Name}} {{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}'
            docker logs --tail 80 "$c" 2>&1
          done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Latest 1.26 patch directly, so the go.mod toolchain line never triggers a second download.
          go-version: "1.26.x"
          check-latest: true
      # gosec runs inside golangci-lint (lint job), which honors the justified //nolint:gosec annotations.
      - run: go tool govulncheck ./...
