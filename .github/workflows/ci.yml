name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Latest 1.26 patch directly, so the go.mod toolchain line never triggers a second download.
          go-version: "1.26.x"
          check-latest: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: make css-check htmx-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Latest 1.26 patch directly, so the go.mod toolchain line never triggers a second download.
          go-version: "1.26.x"
          check-latest: true
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Latest 1.26 patch directly, so the go.mod toolchain line never triggers a second download.
          go-version: "1.26.x"
          check-latest: true
      - run: go test -race -tags=integration ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Latest 1.26 patch directly, so the go.mod toolchain line never triggers a second download.
          go-version: "1.26.x"
          check-latest: true
      # gosec runs inside golangci-lint (lint job), which honors the justified //nolint:gosec annotations.
      - run: go tool govulncheck ./...
